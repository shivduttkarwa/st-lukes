# Field contract for the Wagtail build.
# Each block: template src/_includes/blocks/<name>.njk reads value.<field>; data shape in src/_data/pages/*.json.
# Types are Wagtail block classes. figma = node id on page 20157:4948 of Ec8NFmOIMTGbBVYbdJcKD9.
# image = { src, alt, width, height } → ImageChooserBlock. video = { src, poster } → a document or URL block.

settings:
  site:
    figma: "20169:15359 (menu), 20169:15593 (submenu), 20169:15270 (quick links)"
    fields:
      nav: ListBlock(StructBlock(label, url, children: ListBlock(StructBlock(label, url, image))))   # from the page tree: top-level pages and their live children; image = a page's menu thumbnail
      menu_links: ListBlock(StructBlock(label, url))   # the six small links under the main list
      quick_links: ListBlock(StructBlock(label, url))
      utility_links: ListBlock(StructBlock(label, url))
      socials: ListBlock(StructBlock(network, label, url))   # network = icon id: facebook, instagram, linkedin
      popular_searches: ListBlock(StructBlock(label, url))   # direct links to pages, beside the search results
      footer: StructBlock   # figma 20169:5888 (Footer); template partials/footer.njk
        statement: CharBlock   # top right, Heading 2 at 1.05
        intro: TextBlock
        button: StructBlock(text: CharBlock, url: URLBlock)   # solid
        campuses: ListBlock(StructBlock(name: CharBlock, years: CharBlock, address: TextBlock, directions: URLBlock, phones: ListBlock(StructBlock(label: CharBlock, number: CharBlock, tel: CharBlock))))   # address keeps its line break
        quick_links_title: CharBlock
        quick_links: ListBlock(StructBlock(label: CharBlock, url: URLBlock))
        marquee: ListBlock(CharBlock)   # phrases that loop right to left; odd ones gold outline, even ones solid gold
        affiliations: ListBlock(StructBlock(name: CharBlock, image: ImageChooserBlock))   # white logos; width / height are the design size
        copyright: CharBlock
        abn: CharBlock
        legal_links: ListBlock(StructBlock(label: CharBlock, url: URLBlock))

pages:
  home:
    fields:
      preloader: BooleanField(default=True)   # figma 20169:6962, 20169:6952, 20169:6972, 20225:17119 (Preloader Step 01–04); needs a hero block, plays once per session

blocks:
  hero:
    figma: "20169:5668 (background), 20169:15196 (header, titles, announcement card)"
    template: blocks/hero.njk
    fields:
      image: ImageChooserBlock(required)
      video: DocumentChooserBlock(optional)   # mp4, autoplay muted loop; the image is its poster
      statement: CharBlock
      title_line_1: CharBlock(required)
      title_line_2: CharBlock(required)
      notice: StructBlock(optional)   # could become a site setting so it changes without editing the page
        eyebrow: CharBlock
        title: CharBlock(required)
        text: CharBlock
        image: ImageChooserBlock
        button: StructBlock(text: CharBlock, url: URLBlock)

  page_hero:
    figma: "20420:27600 (Our School Landing: background, eyebrow), 20420:27603 / 20420:27604 (title rows)"
    template: blocks/page_hero.njk
    fields:
      image: ImageChooserBlock(required)   # drawn 1704 × 971 at (−120, −6) in the 1440 × 813 frame; no parallax, the crop has no room above
      video: DocumentChooserBlock(optional)   # mp4, autoplay muted loop; the image is its poster
      eyebrow: CharBlock(optional)   # spaces are kept as typed (Figma has two between "Our" and "School")
      title_line_1: CharBlock(required)   # gold, starts 92 in
      title_line_2: CharBlock(required)   # white, ends 66 in

  collage:
    figma: "20420:27606 / 27616 / 27617 / 27609 / 27631 / 27625 (Our School Landing); same layout in 20348:24214 (Alternative)"
    template: blocks/collage.njk
    fields:
      statement: RichTextBlock(features=[])
      button: StructBlock(text: CharBlock, url: URLBlock)   # solid, no arrow
      portrait: ImageChooserBlock(required)   # fill-810x1004; the frame drifts on scroll, the crop never changes
      video: StructBlock(required)
        title: CharBlock(required)
        image: ImageChooserBlock(required)   # the poster, shown 821 × 514, fill crop
        video: DocumentChooserBlock(optional)   # mp4, plays inline with controls when the pill is pressed
      stat: StructBlock(value: CharBlock, label: TextBlock, caption: CharBlock)   # value counts up; caption runs round the circle
      quote: StructBlock(text: CharBlock, name: CharBlock, role: CharBlock)
      social: StructBlock(image: ImageChooserBlock, url: URLBlock, label: CharBlock)   # the Instagram tile, 296 square

  page_links:
    figma: "20420:28063 (Our School Landing child-page cards)"
    template: blocks/page_links.njk
    fields:
      cards: ListBlock(StructBlock, min_num=1)   # two per row from 768 up
        title: CharBlock(required)   # a line break is kept
        text: TextBlock   # opens on hover
        url: PageChooserBlock or URLBlock
        image: ImageChooserBlock(required)   # decorative, fill-1234x820
        video: DocumentChooserBlock(optional)   # mp4, plays muted on hover

  feature_rows:
    figma: "20412:27187 … 20413:27314 (Our School Landing Alternative, nine rows)"
    template: blocks/feature_rows.njk
    fields:
      rows: ListBlock(StructBlock, min_num=1)   # odd rows photo left, even rows photo right, by position
        title: CharBlock(required)   # Heading 2
        text: TextBlock(required)   # Body 1
        image: ImageChooserBlock(required)   # odd rows fill-1436x1028, even rows fill-1432x1024
        button: StructBlock(text: CharBlock, url: URLBlock)   # solid, no arrow

  inner_hero:
    figma: "20169:5890 (Leadership and Staff), 20262:20150 (Principal's Welcome)"
    template: blocks/inner_hero.njk
    fields:
      image: ImageChooserBlock(required)   # fill-1900x1019, renditions 768 / 1280 / 1900 for the srcset
      video: DocumentChooserBlock(optional)   # mp4, autoplay muted loop; the image is its poster
      title_line_1: CharBlock(required)   # gold
      title_line_2: CharBlock(required)   # gold outline
      title_raised: BooleanBlock(default=False)   # Principal's Welcome draws the title 27 higher and 1 further left

  page_lead:
    figma: "20169:5896, 20262:20199"
    template: blocks/page_lead.njk
    fields:
      statement: TextBlock(required)   # Heading 4
      text: TextBlock(required)   # Body 1

  staff_grid:
    figma: "20169:5899"
    template: blocks/staff_grid.njk
    fields:
      title: CharBlock(required)
      active: CharBlock   # the slug of the tab selected on load
      tabs: ListBlock(StructBlock(label: CharBlock, slug: CharBlock))   # slug "all" shows everyone
      people: ListBlock(StructBlock)   # four per row from 992, three from 768, two below
        name: CharBlock(required)
        role: CharBlock
        groups: CharBlock   # tab slugs separated by spaces
        image: ImageChooserBlock(required)   # decorative, fill-610x610

  where_next:
    figma: "20169:5926 (Leadership and Staff), 20262:20810 (Principal's Welcome); menu component 20225:16862"
    template: blocks/where_next.njk
    fields:
      tight: BooleanBlock(default=False)   # Principal's Welcome: 100 padding and a 50 gap above the menu, against 104 and 75
      title_line_1: CharBlock(required)   # navy
      title_line_2: CharBlock(required)   # navy outline
      cards: ListBlock(StructBlock, min_num=3, max_num=3)   # the first is the large one
        title: CharBlock(required)
        url: PageChooserBlock or URLBlock
        image: ImageChooserBlock(required)   # decorative; first fill-1298x925, others fill-1026x612
      menu: StructBlock
        title_line_1: CharBlock
        title_line_2: CharBlock
        links: ListBlock(StructBlock(label: CharBlock, url: URLBlock, current: BooleanBlock))   # three to a column; from the section's page tree in Wagtail
        buttons: ListBlock(StructBlock(text: CharBlock, url: URLBlock, style: ChoiceBlock(outline-dark)), max_num=2)

  article:
    figma: "20262:19578"
    template: blocks/article.njk
    fields:
      title: CharBlock(required)   # Heading 3
      intro: RichTextBlock(features=[bold])
      image: ImageChooserBlock   # shown 1032 x 614
      quote: TextBlock   # the template adds the quotation marks
      body: RichTextBlock(features=[bold])

  photo_strip:
    figma: "20262:20746"
    template: blocks/photo_strip.njk
    fields:
      start: IntegerBlock(default=0)   # the slide centred on load
      images: ListBlock(ImageChooserBlock, min_num=1)   # each slide takes its width from its photo at a fixed height

  values_collage:
    figma: "20262:22075 (words: 20262:22076)"
    template: blocks/values_collage.njk
    fields:
      image: ImageChooserBlock(required)   # fill-1044x1394
      words: ImageChooserBlock(required)   # an SVG of the word collage; alt carries the sentence
      button: StructBlock(text: CharBlock, url: URLBlock, style: ChoiceBlock(outline))

  faq:
    figma: "20262:22114"
    template: blocks/faq.njk
    fields:
      eyebrow: CharBlock
      title: TextBlock(required)   # a line break is kept
      button: StructBlock(text: CharBlock, url: URLBlock)
      questions: ListBlock(StructBlock, min_num=1)   # the first starts open; one open at a time
        question: CharBlock(required)
        answer: TextBlock   # without one the row stays closed
        button: StructBlock(text: CharBlock, url: URLBlock)

  contact_intro:
    figma: "20169:13367"
    template: blocks/contact_intro.njk
    fields:
      title: CharBlock(required)   # Poppins H2
      text: RichTextBlock(features=[])   # Body 2 paragraphs
      buttons: ListBlock(StructBlock(text: CharBlock, url: URLBlock, style: ChoiceBlock(primary, outline-dark)), max_num=2)
      cards: ListBlock(StructBlock, min_num=4, max_num=4)   # drawn for four; Figma places each one by hand
        title: CharBlock(required)
        text: TextBlock
        links: ListBlock(StructBlock(text: CharBlock, url: URLBlock))

  campus_visit:
    figma: "20169:13393"
    template: blocks/campus_visit.njk
    fields:
      title: CharBlock(required)
      lead: TextBlock
      campuses: ListBlock(StructBlock, min_num=1)   # two per row from 992
        name: CharBlock(required)
        detail: CharBlock
        image: ImageChooserBlock(required)   # fill-1234x824
        rows: ListBlock(StructBlock(icon: ChoiceBlock(location, phone, laptop), label: CharBlock, text: CharBlock, url: URLBlock))
        map: ImageChooserBlock(required)   # Figma's map screenshot, shown 617 x 467
        map_url: URLBlock

  contact_form:
    figma: "20169:13420"
    template: blocks/contact_form.njk
    fields:
      image: ImageChooserBlock(required)   # fill-1280x1527
      title: CharBlock(required)
      text: TextBlock   # line breaks apply from 992 up
      fields: a Wagtail form page's fields (text, email, tel, select, textarea); half = two to a row; error = message when empty; invalid = message when the format is wrong; pattern = optional regex
      button: CharBlock   # the submit label
      success: CharBlock   # shown after a valid send

  connect_band:
    figma: "20169:13436"
    template: blocks/connect_band.njk
    fields:
      title: CharBlock(required)
      text: TextBlock   # the buttons are site.socials

  news_hero:
    figma: "20169:14033 (ground), 20169:14039 (title), 20169:14044 (feature), 20169:14058 (photo), 20169:14034 (connect)"
    template: blocks/news_hero.njk
    fields:
      title_line_1: CharBlock(required)   # gold
      title_line_2: CharBlock(required)   # white
      lead: TextBlock
      stories: the featured news pages, or ListBlock(StructBlock(tag, title, url, image))   # crossfading slider; Figma draws one, slides 2 and 3 reuse list stories
      image: ImageChooserBlock(required)   # fill-1226x820, the photo that drops below the band
      connect: StructBlock(title: CharBlock, text: CharBlock)   # the buttons are site.socials

  news_index:
    figma: "20169:14009"
    template: blocks/news_index.njk   # card markup in snippets/news-card.njk
    fields:
      filters: ListBlock(StructBlock(name, label, options))   # server-side in Wagtail; only category has values here
      search_label: CharBlock
      stories: the NewsPage queryset   # tag, title, url, image fill-818x568

  article_hero:
    figma: "20169:14108 (ground), 20169:14109 (photo, meta, title)"
    template: blocks/article_hero.njk
    fields:
      tag: CharBlock
      date: DateBlock   # shown as "21 SEPTEMBER 2026"
      title: CharBlock(required)
      image: ImageChooserBlock(required)   # shown 1339 x 774

  story_body:
    figma: "20262:20964"
    template: blocks/story_body.njk
    fields:
      sections: ListBlock(StructBlock)
        title: CharBlock(required)   # Heading 3
        body: RichTextBlock(features=[])
        quote: StructBlock(text: TextBlock, name: CharBlock, role: CharBlock)   # optional
      share_label: CharBlock   # the buttons are site.socials
      back: StructBlock(text: CharBlock, url: URLBlock)

  author_card:
    figma: "20262:20261"
    template: blocks/author_card.njk
    fields:
      eyebrow: CharBlock
      name: CharBlock(required)
      bio: TextBlock
      image: ImageChooserBlock(required)   # fill-312x312, shown round

  related_stories:
    figma: "20262:21039"
    template: blocks/related_stories.njk   # card markup in snippets/news-card.njk
    fields:
      title: CharBlock(required)   # Sanshand Heading 1
      button: StructBlock(text: CharBlock, url: URLBlock, style: ChoiceBlock(outline-navy))
      stories: the page's related NewsPages, 3

  sports_tabs:
    figma: "20262:20250"
    template: blocks/sports_tabs.njk
    fields:
      title: TextBlock(required)
      active: CharBlock   # the slug of the tab selected on load
      tabs: ListBlock(StructBlock(label: CharBlock, slug: CharBlock))
      cards: ListBlock(StructBlock)   # Swiper slider, 410 x 521, 6 apart
        title: CharBlock(required)
        url: URLBlock
        groups: CharBlock   # tab slugs separated by spaces
        image: ImageChooserBlock(required)   # decorative

  media_text:
    figma: "20262:20234 (photo right), 20262:20241 (photo left)"
    template: blocks/media_text.njk
    fields:
      side: ChoiceBlock(right, left)   # which side the photo sits on
      title: CharBlock(required)   # Heading 3
      body: RichTextBlock(features=[])
      buttons: ListBlock(StructBlock(text: CharBlock, url: URLBlock, style: ChoiceBlock(primary, outline-navy)), max_num=2)
      note: TextBlock   # the italic fine print
      image: ImageChooserBlock(required)   # fill-1226x1024

  intro:
    figma: "20169:5686 (statement, button), 20169:5689 (photo, button), 20169:5684 (promo video)"
    template: blocks/intro.njk
    fields:
      statement: RichTextBlock(features=[])   # one paragraph; a line break (with a space before it) applies from 992 up, as the design breaks before the last line
      button: StructBlock(text: CharBlock, url: URLBlock)
      image: ImageChooserBlock(required)   # shown 508 × 409, fill crop
      image_button: StructBlock(text: CharBlock, url: URLBlock)   # outline style
      promo: StructBlock(required)
        title: CharBlock(required)
        image: ImageChooserBlock(required)   # the poster, shown 821 × 514, fill crop
        video: DocumentChooserBlock(optional)   # mp4, plays inline with controls when the pill is pressed; the pill is disabled without one

  pillars:
    figma: "20169:5693"
    template: blocks/pillars.njk   # card markup in snippets/pillar-card.njk
    fields:
      eyebrow: CharBlock
      title: CharBlock(required)   # Heading 2
      cards: ListBlock(StructBlock, min_num=4, max_num=4)   # the collage is drawn for four: cards 1 and 3 in the left column, 2 and 4 in the right
        title: CharBlock(required)
        text: TextBlock   # a line break in the text applies from 992 up (white-space: pre-line); below that it reads as a space
        image: ImageChooserBlock(required)
        video: DocumentChooserBlock(optional)   # mp4, plays muted over the image on hover (mouse only, not under reduced motion)
        logo: ImageChooserBlock(optional)   # beside the text, 70 × 70 (Round Square)
        button: StructBlock(text: CharBlock, url: URLBlock)   # outline style

  stats:
    figma: "20169:5726"
    template: blocks/stats.njk
    fields:
      items: ListBlock(StructBlock, min_num=1)   # two per row from 1200 up
        value: CharBlock(required)   # as shown, e.g. "1200+", "99%", ">35"; its first number counts up from 0
        label: CharBlock(required)
        ring: IntegerBlock(min_value=0, max_value=100, default=100)   # how much of the circle the white arc draws, in %; Figma draws 3
      button: StructBlock(text: CharBlock, url: URLBlock)   # outline style

  usps:
    figma: "20169:5734 (cards: USPs Slider 20169:13242)"
    template: blocks/usps.njk   # card markup in snippets/usp-card.njk
    fields:
      eyebrow: CharBlock
      title: CharBlock(required)   # Heading 2
      buttons: ListBlock(StructBlock(text: CharBlock, url: URLBlock, style: ChoiceBlock(primary, outline)), max_num=2)
      background: ImageChooserBlock(required)   # full-bleed behind the cards, shaded navy and royal; renditions 768 / 1280 / 1920 wide for the srcset
      cards: ListBlock(StructBlock, min_num=1)   # Swiper slider, 400 wide (300 below 768), 6 apart
        title: CharBlock(required)   # a line break applies from 768 up
        text: TextBlock   # a line break applies from 768 up
        image: ImageChooserBlock(required)   # square, fill-800x800
        video: DocumentChooserBlock(optional)   # mp4, plays muted over the image on hover (mouse only, not under reduced motion)
        link: StructBlock(text: CharBlock, url: URLBlock)   # the gold bar along the bottom

  campuses:
    figma: "20169:5760 (hover states: Bayview / Dee Why Campus Animation, 20239:19490 / 20262:19527)"
    template: blocks/campuses.njk
    fields:
      title_line_1: CharBlock(required)   # gold
      title_line_2: CharBlock(required)   # gold outline
      buttons: ListBlock(StructBlock(text: CharBlock, url: URLBlock, style: ChoiceBlock(primary, outline)), max_num=2)
      lead: RichTextBlock(features=[])   # paragraphs
      campuses: ListBlock(StructBlock, min_num=2, max_num=2)
        name: CharBlock(required)
        detail: CharBlock   # double spaces around "|" are kept
        url: PageChooserBlock or URLBlock   # the whole card links here
        image: ImageChooserBlock(required)   # fill-1234x820, decorative (the name is the link text)
        video: DocumentChooserBlock(optional)   # mp4, plays muted on hover as in the prototype

  learning:
    figma: "20169:5779 (cards: Entry Points, Normal / Active)"
    template: blocks/learning.njk
    fields:
      title_line_1: CharBlock(required)   # gold
      title_line_2: CharBlock(required)   # gold outline
      cards: ListBlock(StructBlock, min_num=1)   # Swiper slider, 400 × 618 (300 wide below 768), 6 apart
        title: CharBlock(required)   # a line break applies from 768 up
        meta: CharBlock   # the gold line under the title
        text: TextBlock   # the short description revealed on hover
        url: PageChooserBlock or URLBlock   # the whole card links here
        image: ImageChooserBlock(required)   # fill-800x1236, decorative (the title is the link text)
        video: DocumentChooserBlock(optional)   # mp4, plays muted on hover
      button: StructBlock(text: CharBlock, url: URLBlock)   # outline style

  pathways:
    figma: "20169:5850"
    template: blocks/pathways.njk
    fields:
      title_line_1: CharBlock(required)   # navy
      title_line_2: CharBlock(required)   # navy outline
      lead: TextBlock
      button: StructBlock(text: CharBlock, url: URLBlock)   # solid
      rows: ListBlock(StructBlock, min_num=1, max_num=2)   # row 1 runs right to left, row 2 left to right
        logos: ListBlock(StructBlock)
          name: CharBlock(required)   # the image's alt text
          url: URLBlock   # the university or company website
          image: ImageChooserBlock(required)   # width / height are the logo's design size; the script scales it with the root

  discover:
    figma: "20169:5794"
    template: blocks/discover.njk
    fields:
      title_line_1: CharBlock(required)   # gold
      title_line_2: CharBlock(required)   # gold outline
      lead: TextBlock
      buttons: ListBlock(StructBlock(text: CharBlock, url: URLBlock, style: ChoiceBlock(glass, primary, outline)), max_num=2)
      image: ImageChooserBlock(required)   # full-bleed, 2:1; renditions 768 / 1280 / 1920 wide for the srcset
      video: DocumentChooserBlock(optional)   # mp4, autoplay muted loop in place of the image (the image is its poster); held still under reduced motion

  testimonials:
    figma: "20195:16202 (cards: Video Testimonial, Normal / Active)"
    template: blocks/testimonials.njk
    fields:
      title_line_1: CharBlock(required)   # navy
      title_line_2: CharBlock(required)   # navy outline
      cards: ListBlock(StructBlock, min_num=1)   # Swiper slider, 400 × 618 (300 wide below 768), 6 apart
        title: CharBlock(required)   # the person's first name
        meta: CharBlock   # the gold line under the name
        url: PageChooserBlock or URLBlock   # the whole card links here, to the testimonial
        image: ImageChooserBlock(required)   # fill-800x1236, decorative (the name is the link text)
        video: DocumentChooserBlock(optional)   # mp4, plays muted on hover
      button: StructBlock(text: CharBlock, url: URLBlock)   # outline-navy style

  news:
    figma: "20169:5802"
    template: blocks/news.njk
    fields:
      title_line_1: CharBlock(required)   # navy
      title_line_2: CharBlock(required)   # navy outline, same line
      button: StructBlock(text: CharBlock, url: URLBlock)   # outline-navy style
      stories: the latest news pages (NewsPage queryset, newest 4), not editor-entered   # Figma shows one story and 4 dots; the static build repeats it 4 times
        tags: page tags   # shown as "#Tag"
        title: page title
        excerpt: the page's search description or intro
        url: page url
        image: the page's listing image, fill-1234x1026

  social:
    figma: "20169:5831 (content 20169:5832)"
    template: blocks/social.njk
    fields:
      title_line_1: CharBlock(required)   # navy
      title_line_2: CharBlock(required)   # navy outline, same line
      follow_text: CharBlock   # the gold band; its buttons are site.socials
      posts: the school's Instagram feed (latest posts via the Instagram API), not editor-entered   # static build: 8 screenshots from Figma, 352 × 469, each linking to its post

  cta:
    figma: "20169:5887 (CTA Banner component)"
    template: blocks/cta.njk
    fields:
      title_line_1: CharBlock(required)   # white
      title_line_2: CharBlock(required)   # white outline
      buttons: ListBlock(StructBlock(text: CharBlock, url: URLBlock, style: ChoiceBlock(primary, glass, outline)), max_num=2)
      image: ImageChooserBlock(required)   # full-bleed background, and the video's poster
      video: DocumentChooserBlock(optional)   # mp4, autoplay muted loop (Figma has a video fill here); held still under reduced motion

  placeholder:
    template: blocks/placeholder.njk
    note: dev-only stand-in for sections not built yet; not a Wagtail block
    fields:
      label: CharBlock
