# Field contract for the Wagtail build.
# Each block: template src/_includes/blocks/<name>.njk reads value.<field>; data shape in src/_data/pages/*.json.
# Types are Wagtail block classes. figma = node id on page 20157:4948 of Ec8NFmOIMTGbBVYbdJcKD9.
# image = { src, alt, width, height } → ImageChooserBlock. video = { src, poster } → a document or URL block.

settings:
  site:
    figma: "20169:15359 (menu), 20169:15593 (submenu), 20169:15270 (quick links)"
    fields:
      nav: ListBlock(StructBlock(label, url, children: ListBlock(StructBlock(label, url, image))))   # from the page tree: top-level pages and their live children; image = a page's menu thumbnail
      menu_links: ListBlock(StructBlock(label, url))   # the six small links under the main list
      quick_links: ListBlock(StructBlock(label, url))
      utility_links: ListBlock(StructBlock(label, url))
      socials: ListBlock(StructBlock(network, label, url))   # network = icon id: facebook, instagram, linkedin
      popular_searches: ListBlock(CharBlock)
      footer: StructBlock   # figma 20169:5888 (Footer); template partials/footer.njk
        statement: CharBlock   # top right, Heading 2 at 1.05
        intro: TextBlock
        button: StructBlock(text: CharBlock, url: URLBlock)   # solid
        campuses: ListBlock(StructBlock(name: CharBlock, years: CharBlock, address: TextBlock, directions: URLBlock, phones: ListBlock(StructBlock(label: CharBlock, number: CharBlock, tel: CharBlock))))   # address keeps its line break
        quick_links_title: CharBlock
        quick_links: ListBlock(StructBlock(label: CharBlock, url: URLBlock))
        marquee: ListBlock(CharBlock)   # phrases that loop right to left; odd ones gold outline, even ones solid gold
        affiliations: ListBlock(StructBlock(name: CharBlock, image: ImageChooserBlock))   # white logos; width / height are the design size
        copyright: CharBlock
        abn: CharBlock
        legal_links: ListBlock(StructBlock(label: CharBlock, url: URLBlock))

blocks:
  hero:
    figma: "20169:5668 (background), 20169:15196 (header, titles, announcement card)"
    template: blocks/hero.njk
    fields:
      image: ImageChooserBlock(required)
      video: DocumentChooserBlock(optional)   # mp4, autoplay muted loop; the image is its poster
      statement: CharBlock
      title_line_1: CharBlock(required)
      title_line_2: CharBlock(required)
      notice: StructBlock(optional)   # could become a site setting so it changes without editing the page
        eyebrow: CharBlock
        title: CharBlock(required)
        text: CharBlock
        image: ImageChooserBlock
        button: StructBlock(text: CharBlock, url: URLBlock)

  intro:
    figma: "20169:5686 (statement, button), 20169:5689 (photo, button), 20169:5684 (promo video)"
    template: blocks/intro.njk
    fields:
      statement: RichTextBlock(features=[])   # one paragraph; a line break (with a space before it) applies from 992 up, as the design breaks before the last line
      button: StructBlock(text: CharBlock, url: URLBlock)
      image: ImageChooserBlock(required)   # shown 508 × 409, fill crop
      image_button: StructBlock(text: CharBlock, url: URLBlock)   # outline style
      promo: StructBlock(required)
        title: CharBlock(required)
        image: ImageChooserBlock(required)   # the poster, shown 821 × 514, fill crop
        video: DocumentChooserBlock(optional)   # mp4, plays inline with controls when the pill is pressed; the pill is disabled without one

  pillars:
    figma: "20169:5693"
    template: blocks/pillars.njk   # card markup in snippets/pillar-card.njk
    fields:
      eyebrow: CharBlock
      title: CharBlock(required)   # Heading 2
      cards: ListBlock(StructBlock, min_num=4, max_num=4)   # the collage is drawn for four: cards 1 and 3 in the left column, 2 and 4 in the right
        title: CharBlock(required)
        text: TextBlock   # a line break in the text applies from 992 up (white-space: pre-line); below that it reads as a space
        image: ImageChooserBlock(required)
        video: DocumentChooserBlock(optional)   # mp4, plays muted over the image on hover (mouse only, not under reduced motion)
        logo: ImageChooserBlock(optional)   # beside the text, 70 × 70 (Round Square)
        button: StructBlock(text: CharBlock, url: URLBlock)   # outline style

  stats:
    figma: "20169:5726"
    template: blocks/stats.njk
    fields:
      items: ListBlock(StructBlock, min_num=1)   # two per row from 1200 up
        value: CharBlock(required)   # as shown, e.g. "1200+", "99%", ">35"; its first number counts up from 0
        label: CharBlock(required)
        ring: IntegerBlock(min_value=0, max_value=100, default=100)   # how much of the circle the white arc draws, in %
      button: StructBlock(text: CharBlock, url: URLBlock)   # outline style

  usps:
    figma: "20169:5734 (cards: USPs Slider 20169:13242)"
    template: blocks/usps.njk   # card markup in snippets/usp-card.njk
    fields:
      eyebrow: CharBlock
      title: CharBlock(required)   # Heading 2
      buttons: ListBlock(StructBlock(text: CharBlock, url: URLBlock, style: ChoiceBlock(primary, outline)), max_num=2)
      background: ImageChooserBlock(required)   # full-bleed behind the cards, shaded navy and royal; renditions 768 / 1280 / 1920 wide for the srcset
      cards: ListBlock(StructBlock, min_num=1)   # Swiper slider, 400 wide (300 below 768), 6 apart
        title: CharBlock(required)   # a line break applies from 768 up
        text: TextBlock   # a line break applies from 768 up
        image: ImageChooserBlock(required)   # square, fill-800x800
        video: DocumentChooserBlock(optional)   # mp4, plays muted over the image on hover (mouse only, not under reduced motion)
        link: StructBlock(text: CharBlock, url: URLBlock)   # the gold bar along the bottom

  campuses:
    figma: "20169:5760 (hover states: Bayview / Dee Why Campus Animation, 20239:19490 / 20262:19527)"
    template: blocks/campuses.njk
    fields:
      title_line_1: CharBlock(required)   # gold
      title_line_2: CharBlock(required)   # gold outline
      buttons: ListBlock(StructBlock(text: CharBlock, url: URLBlock, style: ChoiceBlock(primary, outline)), max_num=2)
      lead: RichTextBlock(features=[])   # paragraphs
      campuses: ListBlock(StructBlock, min_num=2, max_num=2)
        name: CharBlock(required)
        detail: CharBlock   # double spaces around "|" are kept
        url: PageChooserBlock or URLBlock   # the whole card links here
        image: ImageChooserBlock(required)   # fill-1234x820, decorative (the name is the link text)
        video: DocumentChooserBlock(optional)   # mp4, plays muted on hover as in the prototype

  learning:
    figma: "20169:5779 (cards: Entry Points, Normal / Active)"
    template: blocks/learning.njk
    fields:
      title_line_1: CharBlock(required)   # gold
      title_line_2: CharBlock(required)   # gold outline
      cards: ListBlock(StructBlock, min_num=1)   # Swiper slider, 400 × 618 (300 wide below 768), 6 apart
        title: CharBlock(required)   # a line break applies from 768 up
        meta: CharBlock   # the gold line under the title
        text: TextBlock   # the short description revealed on hover
        url: PageChooserBlock or URLBlock   # the whole card links here
        image: ImageChooserBlock(required)   # fill-800x1236, decorative (the title is the link text)
        video: DocumentChooserBlock(optional)   # mp4, plays muted on hover
      button: StructBlock(text: CharBlock, url: URLBlock)   # outline style

  pathways:
    figma: "20169:5850"
    template: blocks/pathways.njk
    fields:
      title_line_1: CharBlock(required)   # navy
      title_line_2: CharBlock(required)   # navy outline
      lead: TextBlock
      button: StructBlock(text: CharBlock, url: URLBlock)   # solid
      rows: ListBlock(StructBlock, min_num=1, max_num=2)   # row 1 runs right to left, row 2 left to right
        logos: ListBlock(StructBlock)
          name: CharBlock(required)   # the image's alt text
          url: URLBlock   # the university or company website
          image: ImageChooserBlock(required)   # width / height are the logo's design size; the script scales it with the root

  discover:
    figma: "20169:5794"
    template: blocks/discover.njk
    fields:
      title_line_1: CharBlock(required)   # gold
      title_line_2: CharBlock(required)   # gold outline
      lead: TextBlock
      buttons: ListBlock(StructBlock(text: CharBlock, url: URLBlock, style: ChoiceBlock(glass, primary, outline)), max_num=2)
      image: ImageChooserBlock(required)   # full-bleed, 2:1; renditions 768 / 1280 / 1920 wide for the srcset
      video: DocumentChooserBlock(optional)   # mp4, autoplay muted loop in place of the image (the image is its poster); held still under reduced motion

  news:
    figma: "20169:5802"
    template: blocks/news.njk
    fields:
      title_line_1: CharBlock(required)   # navy
      title_line_2: CharBlock(required)   # navy outline, same line
      button: StructBlock(text: CharBlock, url: URLBlock)   # outline-navy style
      stories: the latest news pages (NewsPage queryset, newest 4), not editor-entered   # Figma shows one story and 4 dots; the static build repeats it 4 times
        tags: page tags   # shown as "#Tag"
        title: page title
        excerpt: the page's search description or intro
        url: page url
        image: the page's listing image, fill-1234x1026

  social:
    figma: "20169:5831 (content 20169:5832)"
    template: blocks/social.njk
    fields:
      title_line_1: CharBlock(required)   # navy
      title_line_2: CharBlock(required)   # navy outline, same line
      follow_text: CharBlock   # the gold band; its buttons are site.socials
      posts: the school's Instagram feed (latest posts via the Instagram API), not editor-entered   # static build: 8 screenshots from Figma, 352 × 469, each linking to its post

  cta:
    figma: "20169:5887 (CTA Banner component)"
    template: blocks/cta.njk
    fields:
      title_line_1: CharBlock(required)   # white
      title_line_2: CharBlock(required)   # white outline
      buttons: ListBlock(StructBlock(text: CharBlock, url: URLBlock, style: ChoiceBlock(primary, glass, outline)), max_num=2)
      image: ImageChooserBlock(required)   # full-bleed background, and the video's poster
      video: DocumentChooserBlock(optional)   # mp4, autoplay muted loop (Figma has a video fill here); held still under reduced motion

  placeholder:
    template: blocks/placeholder.njk
    note: dev-only stand-in for sections not built yet; not a Wagtail block
    fields:
      label: CharBlock
